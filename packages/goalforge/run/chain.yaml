name: goalforge-run
description: "goalforge chain: capture → spec → decompose → harden → execute → verify"

inputs:
  feature: opt        # feature slug; required for /spec entry
  wp: opt             # WP slug; required for /plan /implement /verify entry
  dry_run: opt        # --dry-run: resolve + print the step plan, no side effects

ctx:
  identity: []
  semantic_recall: false

# One linear chain. The driver enters the single step admitted by the target's
# on-disk `status:` (run/SKILL.md §Steps); it never reorders or extends this list.

steps:
  - skill: goalforge/capture
    purpose: "Elicit the raw input; write the feature overview.md at status: draft"
    precondition: null   # chain entry; no prior status required

  - skill: goalforge/spec
    purpose: "Propose spec.md — the goal object (outcome + verification.behaviors) and the C1-C7 Interface Contract — on the ungated draft → spec proposal edge (or a respec proposal), then ratify it on the human-gated spec → ready edge"
    precondition:
      target: feature
      status: draft   # a feature at status spec (proposal awaiting ratification, or a respec) is also admitted
    human_gated: true

  - skill: goalforge/decompose
    purpose: "Break the spec into WP folders: the C1 8-section overview.md, checklist items with {files:} and behavior ids, per-WP contract_slice"
    precondition:
      target: feature
      status: ready

  - skill: goalforge/harden
    purpose: "Gates G1-G4 per WP: frontier deps, preharden + section lint, one review pass, goal validate + hash + changelog; spec → hardened → ready"
    precondition:
      target: wp
      status: spec
    human_gated: true    # hardened → ready

  - skill: goalforge/execute
    purpose: "Dispatch one owning agent against the WP checklist, run goal.verification.command, land one commit; ready → executing → implemented"
    precondition:
      target: wp
      status: ready
    workflow_script: run/workflows/<wp>.js   # compiled by scripts/goalforge-workflow-compile.py; launched via the Workflow tool

  - skill: goalforge/verify
    purpose: "Gates A (deterministic + owned-files boundary), B (fresh-context diff review), C (goal judge + one foreign second opinion); implemented → verified"
    precondition:
      target: wp
      status: implemented

  - skill: goalforge/redecompose
    purpose: "Loop-back (re-entrant): reconcile a proposed re-decomposition against verified WPs when a learning invalidates the plan"
    precondition: null   # triggered by a learning, not the linear status flow

recommended_agents:
  - general-purpose    # specialist discovery inside goalforge-execute

on_failure:
  - retry_step: false
  - then: handoff

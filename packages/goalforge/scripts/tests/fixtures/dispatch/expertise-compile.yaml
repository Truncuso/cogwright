# expertise-compile.yaml — hermetic expertise map for the b3 compiler oracle.
#
# `references/expertise-map.yaml` is wp-02-owned sibling data: an oracle that
# reads it pins values another task is free to rewrite. This fixture is the
# compiler's `--expertise <yaml>` input, so the b3 assertion on the emitted
# "Expertise refs:" line is checked against a corpus this test owns.
#
# Shape and admissibility rules are the live map's (corpus-relative paths in
# `rules/common/<x>.md`, `agents/<name>.md`, `skills/<name>`). Only the keys the
# wp-compile.md fixture actually matches are present: `.ts` files, task_type
# `code`, `tags: []`.

by_extension:
  .ts: [agents/typescript-pro.md, skills/bun]

by_tag: {}

by_task_type:
  code: [rules/common/coding-style.md, rules/common/testing.md]

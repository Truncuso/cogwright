# dispatch-smallcap.yaml — dispatch-default.yaml with
# `second_opinion.max_payload_bytes` set to 150 so the OVERSIZE path is driven
# by a real payload: even with the diff truncated to nothing, the section
# headers plus verdict plus overview.md exceed 150 bytes, so the script must
# skip with reason `payload-oversize <actual>/<cap>` rather than hand the leaf
# a payload past the cap (b6, finding N6).

schema_version: 1

providers:
  - name: anthropic
    kind: native
    leaf: null
    propose_only: false
  - name: stub-a
    kind: local
    leaf: skills/agent-dispatch/stub-a/scripts/headless_dispatch
    max_budget_usd: 0.10
    propose_only: true
  - name: stub-b
    kind: foreign
    leaf: skills/agent-dispatch/stub-b/scripts/headless_dispatch
    max_budget_usd: 0.10
    propose_only: true

stages:
  implement:
    model: by_register
    effort: by_register
    provider: anthropic
    endpoint: session
    egress: none
  discovery:
    model: sonnet
    effort: low
    provider: anthropic
    endpoint: session
    egress: none
  feature-audit:
    model: opus
    effort: low
    provider: anthropic
    endpoint: session
    egress: none
  harden-review:
    model: opus
    effort: low
    provider: anthropic
    endpoint: session
    egress: none
  wp-verify:
    model: opus
    effort: high
    provider: anthropic
    endpoint: session
    egress: none
  simplify:
    model: opus
    effort: low
    provider: anthropic
    endpoint: session
    egress: none
  judge:
    model: opus
    effort: high
    provider: anthropic
    endpoint: session
    egress: none
  panel:
    model: opus
    effort: high
    provider: anthropic
    endpoint: session
    egress: overview
  integration-review:
    model: opus
    effort: high
    provider: anthropic
    endpoint: session
    egress: none
  second_opinion:
    model: opus
    effort: low
    provider: stub-a
    endpoint: leaf
    egress: overview

rollup:
  token_warn: 250000

harden:
  token_ceiling: null

second_opinion:
  max_payload_bytes: 150

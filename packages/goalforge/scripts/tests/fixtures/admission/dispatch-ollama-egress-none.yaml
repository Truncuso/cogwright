# V-2: the ADMITTED row of dispatch-ollama.yaml with `egress: none`. A leaf
# dispatch that declares nothing leaves is an incoherent row: admitting it
# would label a foreign-API call non-egressing, so the resolver refuses it
# before the table is consulted.
schema_version: 1

providers:
  - name: anthropic
    kind: native
    leaf: null
    propose_only: false
  - name: ollama
    kind: local
    leaf: skills/agent-dispatch/ollama/scripts/headless_dispatch
    max_budget_usd: 0.10
    propose_only: true

stages:
  implement:
    model: glm-5.3:cloud
    effort: low
    provider: ollama
    endpoint: leaf
    egress: none

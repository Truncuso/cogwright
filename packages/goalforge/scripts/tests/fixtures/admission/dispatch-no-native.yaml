# b4, second leg: a provider list with NO `kind: native` row at all. A refused
# implement resolution has nothing to fall back to and must fail closed.
schema_version: 1

providers:
  - name: stub-b
    kind: foreign
    leaf: skills/agent-dispatch/stub-b/scripts/headless_dispatch
    max_budget_usd: 0.10
    propose_only: true

stages:
  implement:
    model: by_register
    effort: by_register
    provider: stub-b
    endpoint: leaf
    egress: none

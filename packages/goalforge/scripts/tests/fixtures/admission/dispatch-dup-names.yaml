# S-3: two provider rows share a name. `provider_row` returns the first match,
# so the second row's kind/leaf would be live configuration that no resolution
# ever reads; `load_dispatch` refuses the ambiguity instead.
schema_version: 1

providers:
  - name: anthropic
    kind: native
    leaf: null
    propose_only: false
  - name: ollama
    kind: local
    leaf: skills/agent-dispatch/ollama/scripts/headless_dispatch
    propose_only: true
  - name: ollama
    kind: native
    leaf: null
    propose_only: false

stages:
  implement:
    model: glm-5.3:cloud
    effort: low
    provider: ollama
    endpoint: leaf
    egress: overview

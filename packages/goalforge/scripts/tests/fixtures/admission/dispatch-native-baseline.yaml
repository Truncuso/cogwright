# b4 oracle: the SAME providers and the SAME `by_register` implement row, on
# the NATIVE provider. The refused foreign resolution must land on exactly the
# model/effort this config resolves — that is what "the implement STAGE row's
# model/effort resolved as for a native provider" means.
schema_version: 1

providers:
  - name: anthropic
    kind: native
    leaf: null
    propose_only: false
  - name: stub-b
    kind: foreign
    leaf: skills/agent-dispatch/stub-b/scripts/headless_dispatch
    max_budget_usd: 0.10
    propose_only: true

stages:
  implement:
    model: by_register
    effort: by_register
    provider: anthropic
    endpoint: session
    egress: none

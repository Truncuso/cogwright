# admitted-providers.yaml — the provider-admission table (wp-06).
#
# THE SHIPPED TABLE IS EMPTY BY DESIGN. No foreign or local provider is
# admitted to the `implement` role without recorded user evidence; an empty
# table means every non-native implement resolution is REFUSED and falls back
# to the native provider. Absence of the file, or of a row, NEVER means
# "skip admission" (fail-closed) — see references/admission.md.
#
# Row shape (every key required; validated by scripts/goalforge-admission.py,
# which exits 2 naming the row index and the offending key):
#
#   - task_class: code/py              # <task_type>/<ext>, LITERAL extension
#     provider: ollama                 # a references/dispatch.yaml providers[].name
#     model: glm-5.3:cloud             # the provider's own model id — admission
#                                      # binds (task_class, provider, model)
#     leaf: skills/agent-dispatch/ollama/scripts/headless_dispatch
#                                      # the EXECUTABLE the evidence was gathered
#                                      # against, relative to CLAUDE_CONFIG_DIR;
#                                      # must equal the provider row's `leaf`
#     leaf_sha256: <64 hex>            # that file's content hash at admission
#                                      # time — a repointed or edited leaf is
#                                      # refused, it does not inherit the row
#     evidence:
#       kind: user-experience          # user-experience | benchmark | user-addition
#       ref: <locator>                 # where the evidence lives
#     permission_set: [read, write]    # posture documentation — DECLARED, not
#                                      # enforced by this package
#     max_egress: overview             # none | diff-only | overview | full — the
#                                      # declared egress ceiling; a dispatch row
#                                      # whose egress ranks above it is refused
#                                      # (a check between two declarations, not
#                                      # a runtime egress control)
#
# Committing a row: the goalforge pre-commit blocks any commit that adds or
# changes a row unless you confirm INTERACTIVELY on the terminal, and the
# workflow compile admits only the table's committed HEAD content.
#
# Adding a row is a user decision (CLAUDE.md Principle 5: foreign and local
# providers are propose-only). Before the first row lands, re-read the
# `permission-set-declared-not-enforced` risk in the wp-06 overview: the
# containment block and the permission set are carried as DATA; nothing in
# this package enforces them at dispatch time.

schema_version: 1

admitted: []

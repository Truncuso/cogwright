name: Validate Plugins

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate marketplace and plugin manifests
        run: |
          python3 - <<'EOF'
          import json
          import os
          import sys

          def load_json(path):
              with open(path, "r", encoding="utf-8") as f:
                  return json.load(f)

          marketplace_path = ".claude-plugin/marketplace.json"
          marketplace = load_json(marketplace_path)

          assert "name" in marketplace, f"{marketplace_path} missing top-level 'name'"
          plugins = marketplace.get("plugins", [])
          assert isinstance(plugins, list) and plugins, f"{marketplace_path} missing non-empty 'plugins' array"

          for entry in plugins:
              assert entry.get("name"), f"plugin entry missing 'name': {entry}"
              source = entry.get("source")
              assert source, f"plugin entry missing 'source': {entry}"

              if not isinstance(source, str):
                  # git-subdir (or other object) source: validate shape, skip local file checks
                  assert isinstance(source, dict), f"plugin 'source' must be str or object: {entry}"
                  for key in ("source", "url", "path"):
                      assert source.get(key), f"object source missing '{key}': {entry}"
                  continue

              plugin_json_path = os.path.join(source, ".claude-plugin", "plugin.json")
              assert os.path.isfile(plugin_json_path), f"missing {plugin_json_path}"

              plugin_manifest = load_json(plugin_json_path)
              assert "name" in plugin_manifest, f"{plugin_json_path} missing top-level 'name'"
              assert plugin_manifest["name"] == entry["name"], (
                  f"{plugin_json_path} name {plugin_manifest['name']!r} != marketplace entry {entry['name']!r}"
              )

              hooks_path = os.path.join(source, "hooks", "hooks.json")
              if os.path.isfile(hooks_path):
                  load_json(hooks_path)

          print("All plugin manifests valid.")
          EOF

      - name: goalforge artifact drift gate
        run: bash scripts/goalforge-generate.sh --check

      - name: goalforge hook self-tests (both trees)
        run: |
          set -e
          for tree in packages/goalforge plugins/goalforge; do
            for h in goalforge-transition-guard goalforge-open-questions-gate goalforge-single-writer; do
              echo "== $tree/hooks/$h.sh --self-test"
              bash "$tree/hooks/$h.sh" --self-test
            done
          done

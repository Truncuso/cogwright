# S-1: a provider row that DECLARES `kind: native` while carrying an
# agent-dispatch leaf. The kind is derived from the row, never trusted: such a
# row is incoherent and `load_dispatch` refuses the whole dispatch file.
schema_version: 1

providers:
  - name: anthropic
    kind: native
    leaf: skills/agent-dispatch/ollama/scripts/headless_dispatch
    propose_only: false

stages:
  implement:
    model: by_register
    effort: by_register
    provider: anthropic
    endpoint: session
    egress: none

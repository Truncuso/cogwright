# V-1: a non-native implement row whose `model` is a CLAUDE TIER, not the
# provider's own model id. Paired with admitted-claude-tier.yaml, whose row
# names that same tier: the table would "match" and admit a leaf dispatch
# under a model the leaf cannot run. The resolver refuses the row instead.
schema_version: 1

providers:
  - name: anthropic
    kind: native
    leaf: null
    propose_only: false
  - name: ollama
    kind: local
    leaf: skills/agent-dispatch/ollama/scripts/headless_dispatch
    max_budget_usd: 0.10
    propose_only: true

stages:
  implement:
    model: sonnet
    effort: low
    provider: ollama
    endpoint: leaf
    egress: overview

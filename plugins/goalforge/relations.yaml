# Declared relations for the goalforge system.
# `recommends` is soft: a missing companion degrades, never blocks. `requires` is
# hard — goalforge hard-requires the interview plugin, resolved from this
# marketplace at install time. The `degrade:` line on a required companion is the
# runtime fallback (contributor-symlink installs, or a failed resolution), not a
# licence to install without it. See README.md "How systems relate".

requires:
  - name: interview
    kind: skill
    source: interview@cogwright
    used-by: wayfind, goalforge-interview
    degrade: one-question-at-a-time AskUserQuestion loop in the main session

recommends:
  - name: research-analyst
    kind: agent
    used-by: wayfind
    degrade: dispatch a general-purpose agent with an explicit research brief
  - name: adr-write
    kind: skill
    used-by: wayfind
    degrade: skip the ADR gate; log the skipped decisions in the graduation brief
